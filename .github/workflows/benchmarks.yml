# cog-lisp benchmarks, by hand (specs/phase-8.9-ci-cd.md section 4.3). Shared
# runners are too noisy to gate on timings, so nothing fails on a number; the
# report is kept as an artifact to compare with bench/results.md.
name: Benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Pharo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pharo/downloads
          key: pharo-linux-${{ hashFiles('pharo.pins') }}
      - run: ./bootstrap-pharo.sh
      - run: ./build-image.sh
      - name: Run the benchmarks
        run: bench/run-benchmarks.sh || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: bench/results.md
