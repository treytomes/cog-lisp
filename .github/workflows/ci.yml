# cog-lisp CI (specs/phase-8.9-ci-cd.md section 4.1): every suite on Linux and on
# Windows, every suite on Linux again with the seed rebuilt from its source
# (the recovery path, Phase 9 step 9.1), and the VS Code extension's tests, on
# every push and pull request.
# (Until Phase 9 step 9.1, Linux ran every suite twice: once with the Smalltalk
# reader and compiler, which retired then.) release.yml calls this workflow before it builds a
# release. Actions are pinned to commits; the version is in the comment.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Pharo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pharo/downloads
          key: pharo-linux-${{ hashFiles('pharo.pins') }}
      - name: Bootstrap Pharo
        run: ./bootstrap-pharo.sh
      - name: Run every suite
        env:
          TMPDIR: ${{ runner.temp }}
        run: tests/run-all.sh
      - name: Keep the suite outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-linux
          path: |
            ${{ runner.temp }}/coglisp-run-all
            ${{ runner.temp }}/coglisp-runner

  # The way back if every seed is lost (specs/phase-9-language.md 9.1): rebuild
  # the pinned seed from its tagged source, as it was built, without the
  # released seed, then build this tree from it and run every suite.
  recovery:
    name: Linux (seed rebuilt from source)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Cache the Pharo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pharo/downloads
          key: pharo-linux-recovery-${{ hashFiles('pharo.pins') }}
      - name: Bootstrap Pharo, without the released seed
        env:
          COGLISP_SKIP_SEED: '1'
        run: |
          rm -f pharo/downloads/cog-lisp-seed.tar.gz
          ./bootstrap-pharo.sh
      - name: Rebuild the seed from its source
        env:
          TMPDIR: ${{ runner.temp }}
        run: scripts/rebuild-seed.sh
      - name: Run every suite on the rebuilt seed
        env:
          TMPDIR: ${{ runner.temp }}
        run: tests/run-all.sh
      - name: Keep the suite outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-linux-recovery
          path: |
            ${{ runner.temp }}/coglisp-run-all
            ${{ runner.temp }}/coglisp-runner

  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Pharo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pharo\downloads
          key: pharo-windows-${{ hashFiles('pharo.pins') }}
      - name: Bootstrap Pharo
        shell: cmd
        run: bootstrap-pharo.bat
      - name: Run every suite
        shell: cmd
        # the suites write their outputs under %TEMP%: keep them where the next step looks
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: tests\run-all.bat
      - name: Keep the suite outputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output-windows
          path: |
            ${{ runner.temp }}\coglisp-run-all
            ${{ runner.temp }}\coglisp-runner

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - name: The extension packages
        run: npm run package
      - run: npm test
      - name: Cache the VS Code the editor checks run in
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vscode/.vscode-test
          key: vscode-test-1.90.0-linux
      # the download can be reset by the network; the downloader's own retry crashes
      - name: Hover help and completion, inside VS Code
        run: |
          for attempt in 1 2 3; do
            xvfb-run -a npm run test:vscode && exit 0
            echo "attempt $attempt failed"
          done
          exit 1
