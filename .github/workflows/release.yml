# cog-lisp release (specs/phase-8.9-ci-cd.md section 4.2). Pushing a tag such as
# v0.1.0 runs every test (ci.yml), builds the image once on Linux, packages a
# Linux and a Windows bundle and the VS Code extension, tests each bundle on its
# own platform, and only then publishes the GitHub release. A tag with a suffix
# (v0.1.0-rc1) publishes a pre-release. Run by hand (workflow_dispatch) it is a
# dry run: everything but publishing, under the version given.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a dry run (nothing is published), e.g. 0.0.0-dry'
        required: true
        default: 0.0.0-dry

permissions:
  contents: read

env:
  # the tag's version without its v, or the dry run's
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  package:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache the Pharo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: pharo/downloads
          key: pharo-release-${{ hashFiles('pharo.pins') }}
      - name: Bootstrap Pharo
        run: ./bootstrap-pharo.sh
      - name: Build the image
        run: ./build-image.sh
      - name: Package the bundles
        run: release/package.sh "${VERSION#v}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - name: Package the VS Code extension
        working-directory: vscode
        run: |
          npm ci
          npm version "${VERSION#v}" --no-git-tag-version --allow-same-version
          npx vsce package --skip-license --allow-missing-repository --out "../dist/cog-lisp-${VERSION#v}.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.vsix
          if-no-files-found: error

  smoke-linux:
    name: Test the Linux bundle
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Unpack and run every example
        run: |
          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf dist/*-linux-x86_64.tar.gz -C "$RUNNER_TEMP/bundle"
          release/smoke-test.sh "$RUNNER_TEMP/bundle/cog-lisp-${VERSION#v}"

  smoke-windows:
    name: Test the Windows bundle (the image built on Linux)
    needs: package
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Unpack
        shell: pwsh
        run: Expand-Archive -Path (Get-Item dist\*-windows-x86_64.zip) -DestinationPath "$env:RUNNER_TEMP\bundle"
      - name: Run every example, and cog-lisp.bat
        shell: bash
        run: release/smoke-test.sh "$RUNNER_TEMP/bundle/cog-lisp-${VERSION#v}"

  publish:
    needs: [smoke-linux, smoke-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${VERSION#v}"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag $PRERELEASE \
            --title "cog-lisp $VERSION" \
            --notes-file release/NOTES.md \
            --generate-notes
